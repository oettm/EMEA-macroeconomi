name: Update macro dashboard data

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Weekly rather than monthly on purpose: the
    # underlying releases are monthly/quarterly and the commit step is a
    # no-op when nothing changed, so the extra runs cost nothing -- but they
    # make the pipeline self-healing. A run that GitHub skips or delays (the
    # scheduler is best-effort and can drop runs at peak times) no longer
    # costs a whole month of staleness, and the regular pushes double as the
    # repository activity that keeps scheduled workflows from being
    # auto-disabled after 60 days of inactivity.
    # 06:17 rather than 06:00: on-the-hour crons are the most contended slot
    # on GitHub's shared scheduler and the likeliest to be delayed or dropped.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_data.py
        env:
          # Optional: powers the trade_policy_risks LLM web-search summary.
          # If unset, that step falls back to manual_overrides.json (same
          # fallback chain as TTF/PMI) -- the run never fails for lacking it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 fetch_data.py

      - name: Commit data.json if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes to data.json - skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update macro data ($(date -u +%Y-%m-%d))"
          # Rebase before pushing: this workflow and update_indices.yml write
          # different files but share a branch, and GitHub's scheduler can
          # delay either one by hours, so their runs can overlap. Without the
          # rebase the later push is rejected as non-fast-forward and the run
          # fails for a conflict that doesn't actually exist.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed - retrying in 10s..."
            sleep 10
          done
          echo "::error::Could not push data.json after 3 attempts."
          exit 1
